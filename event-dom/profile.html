<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="profile-container">
    <div class="profile-card">

      <!-- Avatar -->
      <div class="profile-avatar">
        <img class="profile-avatar-img"src="https://i.pravatar.cc/150?img=3" alt="User Avatar">
      </div>

      <!-- Info -->
      <div class="profile-info">
        <h2 class="profile-username">john_doe</h2>

        <div class="info-item">
          <i class="fa-solid fa-envelope"></i>
          <span class="profile-email">john.doe@gmail.com</span>
        </div>

        <div class="info-item">
          <i class="fa-solid fa-user"></i>
          <span class="profile-first">John</span>
        </div>

        <div class="info-item">
          <i class="fa-solid fa-user"></i>
          <span class="profile-last">Doe</span>
        </div>

        <div class="info-item">
          <i class="fa-solid fa-venus-mars"></i>
          <span class="profile-gender">Male</span>
        </div>
      </div>

    </div>
  </div>
  <script src="./profile.js"></script>
</body>
</html>
